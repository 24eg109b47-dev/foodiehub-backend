spring.application.name=FoodieHub

server.port=${PORT:8080}

# Cloud & Local Database Support (Defaults to embedded MySQL-mode H2 for zero-config Render deploy, can be overridden with external MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:foodiehub;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

spring.thymeleaf.cache=false