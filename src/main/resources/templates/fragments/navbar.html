<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-egg-fried fs-3 text-danger"></i>
                <span class="text-white fw-bold">Foodie<span class="text-danger">Hub</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Customer Links -->
                    <li sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="nav-item">
                        <a class="nav-link" th:href="@{/customer/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="nav-item">
                        <a class="nav-link" th:href="@{/customer/restaurants}"><i class="bi bi-shop"></i> Restaurants</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="nav-item">
                        <a class="nav-link" th:href="@{/customer/cart}"><i class="bi bi-cart3"></i> Cart</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="nav-item">
                        <a class="nav-link" th:href="@{/customer/orders}"><i class="bi bi-bag-check"></i> Orders</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="nav-item">
                        <a class="nav-link" th:href="@{/customer/profile}"><i class="bi bi-person"></i> Profile</a>
                    </li>

                    <!-- Owner Links -->
                    <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')" class="nav-item">
                        <a class="nav-link" th:href="@{/owner/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')" class="nav-item">
                        <a class="nav-link" th:href="@{/owner/restaurant}"><i class="bi bi-building"></i> My Restaurant</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')" class="nav-item">
                        <a class="nav-link" th:href="@{/owner/menu}"><i class="bi bi-journal-text"></i> Menu Management</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_RESTAURANT_OWNER')" class="nav-item">
                        <a class="nav-link" th:href="@{/owner/orders}"><i class="bi bi-receipt"></i> Incoming Orders</a>
                    </li>

                    <!-- Admin Links -->
                    <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}"><i class="bi bi-people"></i> Users</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/restaurants}"><i class="bi bi-shop-window"></i> Restaurants</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/categories}"><i class="bi bi-tags"></i> Categories</a>
                    </li>
                    <li sec:authorize="hasAuthority('ROLE_ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/orders}"><i class="bi bi-box-seam"></i> All Orders</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li sec:authorize="isAnonymous()" class="nav-item">
                        <a class="nav-link btn btn-outline-light btn-sm me-2 px-3 text-white" th:href="@{/login}">Login</a>
                    </li>
                    <li sec:authorize="isAnonymous()" class="nav-item">
                        <a class="nav-link btn btn-danger btn-sm text-white px-3" th:href="@{/register}">Register</a>
                    </li>
                    <li sec:authorize="isAuthenticated()" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-light d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right"></i> Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
