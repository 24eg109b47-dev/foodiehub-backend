<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Access Denied - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-auto text-center py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <i class="bi bi-shield-lock display-1 text-danger"></i>
                <h1 class="display-4 fw-bold mt-3">403 - Access Denied</h1>
                <p class="lead text-muted" th:text="${errorMessage != null ? errorMessage : 'You do not have permission to access this page or resource.'}">Unauthorized Access</p>
                <a th:href="@{/dashboard}" class="btn btn-danger btn-lg mt-3"><i class="bi bi-speedometer2"></i> Go to Your Dashboard</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
