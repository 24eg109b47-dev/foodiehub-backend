<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Restaurants - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <div class="row align-items-center mb-4">
            <div class="col-md-6">
                <h2 class="fw-bold"><i class="bi bi-shop text-danger"></i> Approved Restaurants</h2>
                <p class="text-muted">Explore top dining places offering delicious meals near you.</p>
            </div>
            <div class="col-md-6">
                <form th:action="@{/customer/restaurants}" method="get" class="d-flex gap-2">
                    <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by restaurant name...">
                    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-search"></i></button>
                </form>
            </div>
        </div>

        <div class="row g-4">
            <div th:each="restaurant : ${restaurants}" class="col-md-6 col-lg-4">
                <div class="card fh-card h-100 border-0 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop" class="card-img-top fh-card-img" alt="Restaurant">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold" th:text="${restaurant.name}">Restaurant Name</h5>
                        <p class="card-text text-muted small flex-grow-1" th:text="${restaurant.description}">Description</p>
                        <p class="small mb-1"><i class="bi bi-geo-alt text-danger"></i> <span th:text="${restaurant.address}">Address</span></p>
                        <p class="small mb-1"><i class="bi bi-telephone text-success"></i> <span th:text="${restaurant.phone}">Phone</span></p>
                        <p class="small mb-3"><i class="bi bi-clock text-primary"></i> Timings: <span th:text="${restaurant.openingTime} + ' - ' + ${restaurant.closingTime}">09:00 AM - 10:00 PM</span></p>
                        <a th:href="@{/customer/restaurants/{id}(id=${restaurant.id})}" class="btn btn-danger w-100 mt-auto"><i class="bi bi-book-half"></i> View Menu</a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(restaurants)}" class="col-12 text-center text-muted py-5">
                <i class="bi bi-shop-window display-1 text-secondary"></i>
                <p class="lead mt-3">No approved restaurants found matching your criteria.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
