<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <div class="row g-4">
            <!-- Saved Addresses -->
            <div class="col-lg-7">
                <h3 class="fw-bold mb-4"><i class="bi bi-geo-alt text-danger"></i> Saved Delivery Addresses</h3>

                <div class="row g-3">
                    <div th:each="addr : ${addresses}" class="col-md-12">
                        <div class="card fh-card border-0 p-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h5 class="fw-bold mb-1" th:text="${addr.label != null && !addr.label.isEmpty() ? addr.label : 'Address'}">Home</h5>
                                    <span th:if="${addr.defaultAddress}" class="badge bg-success mb-2">Default Address</span>
                                    <p class="mb-1 text-muted" th:text="${addr.addressLine} + ', ' + ${addr.city} + ', ' + ${addr.state} + ' - ' + ${addr.pincode}">Address</p>
                                    <small class="text-secondary"><i class="bi bi-telephone"></i> <span th:text="${addr.phone}">Phone</span></small>
                                </div>
                                <div class="d-flex flex-column gap-2">
                                    <form th:if="${!addr.defaultAddress}" th:action="@{/customer/addresses/default/{id}(id=${addr.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-success w-100"><i class="bi bi-star"></i> Set Default</button>
                                    </form>
                                    <form th:action="@{/customer/addresses/delete/{id}(id=${addr.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-outline-danger w-100"><i class="bi bi-trash"></i> Delete</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(addresses)}" class="col-12 text-center py-4 text-muted">
                        <p class="lead">No saved addresses found. Add your primary delivery address below.</p>
                    </div>
                </div>
            </div>

            <!-- Add Address Form -->
            <div class="col-lg-5">
                <div class="card fh-card border-0 p-4">
                    <h4 class="fw-bold mb-3"><i class="bi bi-plus-circle text-danger"></i> Add New Address</h4>

                    <form th:action="@{/customer/addresses/add}" th:object="${addressDto}" method="post">
                        <div class="mb-3">
                            <label for="label" class="form-label">Address Label (e.g. Home, Office)</label>
                            <input type="text" class="form-control" th:field="*{label}" placeholder="Home">
                        </div>

                        <div class="mb-3">
                            <label for="addressLine" class="form-label">Address Line</label>
                            <textarea class="form-control" th:field="*{addressLine}" rows="2" placeholder="House/Flat No., Street, Area" required></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="city" class="form-label">City</label>
                                <input type="text" class="form-control" th:field="*{city}" placeholder="Hyderabad" required>
                            </div>
                            <div class="col-md-6">
                                <label for="state" class="form-label">State</label>
                                <input type="text" class="form-control" th:field="*{state}" placeholder="Telangana" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="pincode" class="form-label">Pincode</label>
                                <input type="text" class="form-control" th:field="*{pincode}" placeholder="500001" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="text" class="form-control" th:field="*{phone}" placeholder="9876543210" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{defaultAddress}" id="isDefault">
                            <label class="form-check-label" for="isDefault">Set as default address</label>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 font-weight-bold"><i class="bi bi-save"></i> Save Address</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
