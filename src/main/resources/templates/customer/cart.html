<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <h2 class="fw-bold mb-4"><i class="bi bi-cart3 text-danger"></i> Your Shopping Cart</h2>

        <div th:if="${cart.items != null && !cart.items.isEmpty()}" class="row g-4">
            <div class="col-lg-8">
                <div class="card fh-card border-0 p-3">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Price</th>
                                    <th>Quantity</th>
                                    <th>Subtotal</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cart.items}">
                                    <td>
                                        <div class="fw-bold" th:text="${item.menuItem.name}">Item Name</div>
                                        <small class="text-muted" th:text="${item.menuItem.restaurant.name}">Restaurant</small>
                                    </td>
                                    <td th:text="'₹' + ${#numbers.formatDecimal(item.menuItem.price, 1, 2)}">₹0.00</td>
                                    <td>
                                        <form th:action="@{/customer/cart/update}" method="post" class="d-flex gap-1 align-items-center" style="max-width: 120px;">
                                            <input type="hidden" name="cartItemId" th:value="${item.id}">
                                            <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="20" class="form-control form-control-sm text-center">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary" title="Update Quantity"><i class="bi bi-arrow-repeat"></i></button>
                                        </form>
                                    </td>
                                    <td class="fw-bold text-danger" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">₹0.00</td>
                                    <td>
                                        <form th:action="@{/customer/cart/remove}" method="post">
                                            <input type="hidden" name="cartItemId" th:value="${item.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card fh-card border-0 p-4">
                    <h5 class="fw-bold border-bottom pb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Items Subtotal</span>
                        <span th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3">
                        <span>Delivery Fee</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 fs-5 fw-bold">
                        <span>Total Amount</span>
                        <span class="text-danger" th:text="'₹' + ${#numbers.formatDecimal(total, 1, 2)}">₹0.00</span>
                    </div>

                    <a th:href="@{/customer/checkout}" class="btn btn-danger btn-lg w-100 font-weight-bold"><i class="bi bi-credit-card"></i> Proceed to Checkout</a>
                </div>
            </div>
        </div>

        <div th:if="${cart.items == null || cart.items.isEmpty()}" class="text-center py-5">
            <i class="bi bi-cart-x display-1 text-muted"></i>
            <h3 class="fw-bold mt-3">Your Cart is Empty</h3>
            <p class="text-muted">Looks like you haven't added anything to your cart yet.</p>
            <a th:href="@{/customer/restaurants}" class="btn btn-danger btn-lg mt-2"><i class="bi bi-shop"></i> Explore Restaurants</a>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
