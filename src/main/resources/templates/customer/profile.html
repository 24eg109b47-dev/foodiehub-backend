<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card fh-card border-0 p-4">
                    <h3 class="fw-bold mb-4"><i class="bi bi-person-circle text-danger"></i> Profile Management</h3>

                    <form th:action="@{/customer/profile}" th:object="${profileDto}" method="post">
                        <div class="mb-3">
                            <label class="form-label font-weight-bold">Email Address (Immutable)</label>
                            <input type="email" class="form-control" th:value="${user.email}" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>

                        <div class="mb-4">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" th:field="*{phone}" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 font-weight-bold"><i class="bi bi-save"></i> Save Profile Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
