<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card fh-card shadow p-4 border-0">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus-fill fs-1 text-danger"></i>
                        <h3 class="fw-bold mt-2">Create an Account</h3>
                        <p class="text-muted small">Join FoodieHub as a Customer or Restaurant Owner</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userRegistrationDto}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="John Doe" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="john@example.com" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" th:field="*{phone}" placeholder="9876543210" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" placeholder="At least 6 characters" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Register As</label>
                            <div class="d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{role}" id="roleCustomer" value="ROLE_CUSTOMER" checked>
                                    <label class="form-check-label" for="roleCustomer">
                                        <i class="bi bi-person"></i> Customer
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" th:field="*{role}" id="roleOwner" value="ROLE_RESTAURANT_OWNER">
                                    <label class="form-check-label" for="roleOwner">
                                        <i class="bi bi-shop"></i> Restaurant Owner
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 py-2 font-weight-bold"><i class="bi bi-check-circle"></i> Create Account</button>
                    </form>

                    <div class="mt-4 text-center">
                        <p class="small text-muted">Already have an account? <a th:href="@{/login}" class="text-danger fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
