<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management - FoodieHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <div class="row g-4">
            <!-- Category List -->
            <div class="col-lg-7">
                <h3 class="fw-bold mb-4"><i class="bi bi-tags text-danger"></i> Menu Categories</h3>

                <div class="card fh-card border-0 p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Category Name</th>
                                    <th>Description</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td><strong th:text="'#' + ${cat.id}">#1</strong></td>
                                    <td class="fw-bold text-danger" th:text="${cat.name}">Category</td>
                                    <td class="small text-muted" th:text="${cat.description}">Description</td>
                                    <td>
                                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this category?');"><i class="bi bi-trash"></i> Delete</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Add Category Form -->
            <div class="col-lg-5">
                <div class="card fh-card border-0 p-4">
                    <h4 class="fw-bold mb-3"><i class="bi bi-plus-circle text-danger"></i> Add New Category</h4>

                    <form th:action="@{/admin/categories/add}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label font-weight-bold">Category Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Desserts" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label font-weight-bold">Description</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Category summary..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-danger w-100 font-weight-bold"><i class="bi bi-save"></i> Save Category</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
