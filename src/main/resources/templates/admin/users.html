<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - FoodieHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <h2 class="fw-bold mb-4"><i class="bi bi-people text-danger"></i> Registered System Users</h2>

        <div class="card fh-card border-0 p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Account Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td><strong th:text="'#' + ${user.id}">#1</strong></td>
                            <td class="fw-bold" th:text="${user.name}">John Doe</td>
                            <td th:text="${user.email}">john@example.com</td>
                            <td th:text="${user.phone}">9876543210</td>
                            <td>
                                <span class="badge" th:classappend="${user.role.name() == 'ROLE_ADMIN' ? 'bg-danger' : (user.role.name() == 'ROLE_RESTAURANT_OWNER' ? 'bg-primary' : 'bg-success')}" th:text="${user.role}">ROLE</span>
                            </td>
                            <td>
                                <span class="badge" th:classappend="${user.enabled ? 'bg-success' : 'bg-danger'}" th:text="${user.enabled ? 'Active' : 'Disabled'}">Active</span>
                            </td>
                            <td>
                                <form th:if="${user.role.name() != 'ROLE_ADMIN'}" th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post">
                                    <button type="submit" class="btn btn-sm" th:classappend="${user.enabled ? 'btn-outline-danger' : 'btn-outline-success'}"
                                            th:text="${user.enabled ? 'Deactivate' : 'Activate'}">Toggle</button>
                                </form>
                                <small th:if="${user.role.name() == 'ROLE_ADMIN'}" class="text-muted">Protected System Admin</small>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
