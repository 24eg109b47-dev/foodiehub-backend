<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Approvals - FoodieHub Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <h2 class="fw-bold mb-4"><i class="bi bi-shop-window text-danger"></i> Restaurant Approvals & Management</h2>

        <div class="card fh-card border-0 p-3">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Restaurant Name</th>
                            <th>Owner</th>
                            <th>Address & Phone</th>
                            <th>Approval Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${restaurants}">
                            <td><strong th:text="'#' + ${r.id}">#1</strong></td>
                            <td class="fw-bold" th:text="${r.name}">FoodieHub Kitchen</td>
                            <td th:text="${r.owner.name} + ' (' + ${r.owner.email} + ')'">Owner</td>
                            <td th:text="${r.address} + ' | ' + ${r.phone}">Address & Phone</td>
                            <td>
                                <span class="badge fs-6" th:classappend="'badge-' + ${#strings.toLowerCase(r.status)}" th:text="${r.status}">APPROVED</span>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:if="${r.status.name() != 'APPROVED'}" th:action="@{/admin/restaurants/{id}/approve(id=${r.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check-lg"></i> Approve</button>
                                    </form>
                                    <form th:if="${r.status.name() != 'REJECTED'}" th:action="@{/admin/restaurants/{id}/reject(id=${r.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-x-lg"></i> Reject</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
