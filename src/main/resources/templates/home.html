<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieHub - Online Food Ordering System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <!-- Hero Section -->
    <header class="bg-dark text-white py-5 shadow-sm mb-5 position-relative overflow-hidden" style="background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200&auto=format&fit=crop') center/cover no-repeat;">
        <div class="container py-5 text-center">
            <h1 class="display-3 fw-bold mb-3">Delicious Food Delivered Fast</h1>
            <p class="lead mb-4 text-light">Order from top restaurants or manage your culinary business with FoodieHub</p>
            <div class="d-flex justify-content-center gap-3">
                <a th:href="@{/register}" class="btn btn-danger btn-lg px-4"><i class="bi bi-person-plus"></i> Get Started</a>
                <a th:href="@{/login}" class="btn btn-outline-light btn-lg px-4"><i class="bi bi-box-arrow-in-right"></i> Sign In</a>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <h2 class="fw-bold mb-4 text-center">Featured Approved Restaurants</h2>
        <div class="row g-4">
            <div th:each="restaurant : ${featuredRestaurants}" class="col-md-6 col-lg-4">
                <div class="card fh-card h-100">
                    <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500&auto=format&fit=crop" class="card-img-top fh-card-img" alt="Restaurant">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold" th:text="${restaurant.name}">Restaurant Name</h5>
                        <p class="card-text text-muted small flex-grow-1" th:text="${restaurant.description}">Description</p>
                        <p class="small mb-2"><i class="bi bi-geo-alt text-danger"></i> <span th:text="${restaurant.address}">Address</span></p>
                        <p class="small mb-3"><i class="bi bi-clock text-primary"></i> <span th:text="${restaurant.openingTime} + ' - ' + ${restaurant.closingTime}">Hours</span></p>
                        <a th:href="@{/login}" class="btn btn-outline-danger w-100 mt-auto"><i class="bi bi-eye"></i> View Menu</a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(featuredRestaurants)}" class="col-12 text-center text-muted py-4">
                <p class="lead">No approved restaurants currently listed.</p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
