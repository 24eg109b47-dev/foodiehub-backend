<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Restaurant - FoodieHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/foodiehub.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/messages :: messages}"></div>

    <main class="container my-4">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                <div class="card fh-card border-0 p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold mb-0"><i class="bi bi-building text-danger"></i> Restaurant Information</h3>
                        <span th:if="${restaurant != null}" class="badge fs-6" th:classappend="'badge-' + ${#strings.toLowerCase(restaurant.status)}" th:text="${restaurant.status}">PENDING</span>
                    </div>

                    <form th:action="@{/owner/restaurant/save}" th:object="${restaurantDto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label font-weight-bold">Restaurant Name</label>
                            <input type="text" class="form-control" th:field="*{name}" placeholder="e.g. FoodieHub Kitchen" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label font-weight-bold">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Brief summary of your restaurant specialties..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label font-weight-bold">Address</label>
                            <input type="text" class="form-control" th:field="*{address}" placeholder="Full address" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="phone" class="form-label font-weight-bold">Contact Phone</label>
                                <input type="text" class="form-control" th:field="*{phone}" placeholder="Phone number" required>
                            </div>
                            <div class="col-md-4">
                                <label for="openingTime" class="form-label font-weight-bold">Opening Time</label>
                                <input type="text" class="form-control" th:field="*{openingTime}" placeholder="e.g. 09:00 AM">
                            </div>
                            <div class="col-md-4">
                                <label for="closingTime" class="form-label font-weight-bold">Closing Time</label>
                                <input type="text" class="form-control" th:field="*{closingTime}" placeholder="e.g. 10:00 PM">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 font-weight-bold mt-3"><i class="bi bi-save"></i> Save Restaurant Information</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/foodiehub.js}"></script>
</body>
</html>
